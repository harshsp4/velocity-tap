<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neptune Keyboard Sounds</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">⌨</div>
      <h1>Velocity Tap</h1>
    </header>
    
    <div class="section">
      <label class="toggle-label">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-text">Enable Sounds</span>
      </label>
    </div>
    
    <div class="section">
      <label for="sound-pack">Sound Pack</label>
      <select id="sound-pack"></select>
    </div>
    
    <div class="section">
      <label for="volume">Volume <span id="volume-value">50%</span></label>
      <input type="range" id="volume" min="0" max="100" value="50">
    </div>
    
    <div class="section info">
      <p>17 mechanical keyboard sound packs from the Neptune project.</p>
      <p>Works on all text inputs, textareas, and contenteditable elements.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
